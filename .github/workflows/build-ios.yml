# Baut Nut AI als UNSIGNIERTE .ipa auf einem macOS-Server von GitHub.
# Signiert und installiert wird danach unter Windows mit Sideloadly (oder SideStore).
#
# Ablage im eigenen Fork: .github/workflows/build-ios.yml
# Start: Tab "Actions" -> "Build iOS IPA" -> "Run workflow"
# Ergebnis: unten im fertigen Lauf unter "Artifacts" -> NutAI-ipa
#   NutAI.ipa              mit Homescreen-Widget (App Group, ad-hoc vorsigniert)
#   NutAI-ohne-Widget.ipa  ohne Widget-Erweiterung, falls das Sideloading-Tool
#                          App Groups mit einer kostenlosen Apple-ID ablehnt

name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Neuestes Xcode 26 auswaehlen
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Verwende $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Tests (App-Datenlogik)
        run: npx vitest run apps/mobile/src packages/db-adapter

      - name: Naehrwert-Datenbank bauen (USDA)
        run: npm run data:build

      - name: Oesterreichische Produkte hinzufuegen (Open Food Facts)
        run: npm run data:build:at

      - name: Datenbank pruefen (nur Info)
        continue-on-error: true
        run: npm run data:verify

      - name: iOS-Projekt erzeugen
        working-directory: apps/mobile
        env:
          CI: "1"
        run: |
          npx expo prebuild --platform ios --clean
          node scripts/use-release-scheme.mjs

      - name: App bauen (ohne Signatur)
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace NutAI.xcworkspace \
            -scheme NutAI \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1 || { tail -150 xcodebuild.log; exit 1; }
          tail -20 xcodebuild.log

      - name: IPA verpacken
        working-directory: apps/mobile/ios
        run: |
          set -e
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)
          echo "Gefunden: $APP"
          ls "$APP/PlugIns" || true

          # Entitlements as the sideloading tool should register them. Push
          # (aps-environment) is deliberately absent: reminders are LOCAL
          # notifications, and a free Apple ID cannot sign push anyway.
          GROUP=$(/usr/libexec/PlistBuddy -c 'Print :NutAIAppGroup' "$APP/Info.plist")
          cat > app.entitlements <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.application-groups</key><array><string>${GROUP}</string></array>
          </dict></plist>
          PLIST
          sed -i '' 's/^          //' app.entitlements
          cat app.entitlements

          # --- Variant 1: with widget, ad-hoc pre-signed so the entitlements travel inside the binaries.
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          A="Payload/$(basename "$APP")"
          find "$A/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -print0 2>/dev/null | \
            xargs -0 -I{} codesign --force --sign - --timestamp=none "{}" || true
          for X in "$A"/PlugIns/*.appex; do
            [ -d "$X" ] || continue
            codesign --force --sign - --timestamp=none --entitlements app.entitlements "$X"
          done
          codesign --force --sign - --timestamp=none --entitlements app.entitlements "$A"
          codesign -d --entitlements :- "$A" 2>/dev/null | head -20 || true
          zip -qry NutAI.ipa Payload

          # --- Variant 2: no widget extension, unsigned (exactly like earlier builds).
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          rm -rf "Payload/$(basename "$APP")/PlugIns"
          zip -qry NutAI-ohne-Widget.ipa Payload

          ls -lh NutAI.ipa NutAI-ohne-Widget.ipa

      - name: IPA hochladen
        uses: actions/upload-artifact@v4
        with:
          name: NutAI-ipa
          path: |
            apps/mobile/ios/NutAI.ipa
            apps/mobile/ios/NutAI-ohne-Widget.ipa
          retention-days: 30
